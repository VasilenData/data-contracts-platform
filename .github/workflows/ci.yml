name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Contract diff gate (v1 to v2 must pass, v1 to v3 must be rejected)
        run: |
          export PYTHONPATH=src
          python -m datacontracts diff contracts/yellow_taxi_v1.yaml contracts/yellow_taxi_v2.yaml
          if python -m datacontracts diff contracts/yellow_taxi_v1.yaml contracts/yellow_taxi_v3_breaking.yaml; then
            echo "breaking change was not rejected"; exit 1
          fi
      - name: Annotation demo (a sample file that breaks three rules, shown on the run summary)
        run: |
          export PYTHONPATH=src
          python -c "import duckdb; c = duckdb.connect(); c.execute(\"COPY (SELECT * FROM (VALUES (1, 5.0, 'paid'), (1, -2.0, 'paid'), (3, 9.0, 'lost')) t(order_id, amount, status)) TO 'demo_orders.parquet' (FORMAT PARQUET)\")"
          python -m datacontracts validate contracts/demo_orders.yaml demo_orders.parquet --format github || test $? -eq 1
  dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Airflow with the official constraints
        run: |
          pip install -r requirements-dev.txt "apache-airflow==2.10.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
      - name: DAG imports and keeps its retry policy
        run: |
          export PYTHONPATH=src AIRFLOW_HOME=$RUNNER_TEMP/af AIRFLOW__CORE__LOAD_EXAMPLES=False
          pytest -q tests/test_dag.py
